name: Deploy FAW Theme

on:
  push:
    branches: [main]
    paths:
      - 'faw/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FAW_SSH_KEY }}" > ~/.ssh/faw_deploy
          chmod 600 ~/.ssh/faw_deploy
          ssh-keyscan -H ${{ secrets.FAW_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy theme via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.gitignore' \
            -e "ssh -i ~/.ssh/faw_deploy -o IdentitiesOnly=yes" \
            faw/ \
            ${{ secrets.FAW_SSH_USER }}@${{ secrets.FAW_SSH_HOST }}:~/public_html/website_7ddacff9/wp-content/themes/faw/

      - name: Fix permissions
        run: |
          ssh -i ~/.ssh/faw_deploy -o IdentitiesOnly=yes \
            ${{ secrets.FAW_SSH_USER }}@${{ secrets.FAW_SSH_HOST }} \
            "find ~/public_html/website_7ddacff9/wp-content/themes/faw/ -type d -exec chmod 755 {} \; && \
             find ~/public_html/website_7ddacff9/wp-content/themes/faw/ -type f -exec chmod 644 {} \;"

      - name: Flush caches
        run: |
          ssh -i ~/.ssh/faw_deploy -o IdentitiesOnly=yes \
            ${{ secrets.FAW_SSH_USER }}@${{ secrets.FAW_SSH_HOST }} \
            "cd ~/public_html/website_7ddacff9 && wp cache flush 2>/dev/null; wp rewrite flush 2>/dev/null; echo 'Deploy complete'"

      - name: Done
        run: echo "✅ FAW theme deployed and cache flushed"
